<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沈老師的小程式 all in one </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-cubes text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">小程式入口</h1>
          <p class="text-xs text-slate-500">應用程式</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button type="button" onclick="openBackupModal()" class="px-3 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-1.5 border border-slate-300">
          <i class="fa-solid fa-file-export text-slate-500"></i>
          <span>備份 / 匯入</span>
        </button>
        <button type="button" onclick="openAddModal()" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-lg shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>新增小程式</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 pt-6">

    <!-- Search & Filter Bar -->
    <div class="flex flex-col md:flex-row gap-3 mb-6 items-center justify-between">
      <!-- Search Input -->
      <div class="relative w-full md:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderApps()" placeholder="搜尋小程式..." class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 shadow-sm">
      </div>

      <!-- Category Filter Pills -->
      <div id="categoryFilter" class="flex flex-wrap gap-1.5 w-full md:w-auto overflow-x-auto pb-1">
      </div>
    </div>

    <!-- App Grid -->
    <div id="appsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
      <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 font-medium text-sm">找不到符合條件的小程式</p>
      <button type="button" onclick="resetSearch()" class="mt-3 text-xs text-blue-600 hover:underline">重設搜尋條件</button>
    </div>

  </main>

  <!-- Modal: Add / Edit App -->
  <div id="appModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden transform transition-all">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-slate-800">新增小程式</h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="appForm" onsubmit="saveApp(event)" class="p-6 space-y-4">
        <input type="hidden" id="appId">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">程式名稱 *</label>
          <input type="text" id="appName" required placeholder="例如：空節搜尋器" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/50 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">程式網址 (URL)</label>
          <input type="text" id="appUrl" placeholder="https://shamsham2026.github.io/xxx 或完整網址" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/50 focus:outline-none">
          <p class="text-[11px] text-slate-400 mt-1">若僅填寫名稱（如 to-do-list），系統會自動加上 https://shamsham2026.github.io/</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">分類</label>
          <input type="text" id="appCategory" placeholder="例如：實用工具、行政管理" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/50 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">選擇圖示</label>
          <div class="grid grid-cols-6 gap-2" id="iconPicker"></div>
          <input type="hidden" id="appIcon" value="fa-cubes">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">主題顏色</label>
          <div class="flex gap-2" id="colorPicker"></div>
          <input type="hidden" id="appColor" value="from-blue-500 to-indigo-600">
        </div>

        <div class="pt-4 flex justify-between items-center border-t border-slate-100">
          <button type="button" id="deleteBtn" onclick="deleteApp()" class="px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg hidden">
            刪除此小程式
          </button>
          <div class="flex gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
            <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Backup / Export / Import -->
  <div id="backupModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-slate-800">備份與匯入資料</h3>
        <button type="button" onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <p class="text-xs text-slate-500 leading-relaxed">
          您可以複製下方 JSON 格式備份設定，或貼上備份資料點擊「載入設定」進行復原。
        </p>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">配置 JSON 資料</label>
          <textarea id="backupData" rows="7" class="w-full font-mono text-xs p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/50 focus:outline-none bg-slate-50"></textarea>
        </div>

        <div class="flex flex-wrap gap-2 justify-between items-center pt-2 border-t border-slate-100">
          <button type="button" onclick="resetToDefault()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg">
            重設為原廠預設
          </button>
          <div class="flex gap-2">
            <button type="button" onclick="copyBackupJSON()" class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg">
              <i class="fa-regular fa-copy mr-1"></i>複製設定
            </button>
            <button type="button" onclick="importBackupJSON()" class="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">
              載入設定
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">已儲存變更</span>
  </div>

  <script>
    const BASE_URL = 'https://shamsham2026.github.io/';

    const DEFAULT_APPS = [
      {
        id: '1',
        title: '教師空節搜尋器',
        category: '實用工具',
        icon: 'fa-calculator',
        color: 'from-blue-500 to-indigo-600',
        url: 'https://shamsham2026.github.io/free_lesson_lookup/'
      },
      {
       id: '2',
        title: '工作提示器',
        category: '實用工具',
        icon: 'fa-list-check',
        color: 'from-amber-500 to-orange-600',
        url: 'https://shamsham2026.github.io/to-do-list' 
      },
      {id: '3',
        title: '小一註冊日_購買校服排隊系統',
        category: '行政管理',
        icon: 'fa-user-check',
        color: 'from-emerald-500 to-teal-600',
        url: 'https://shamsham2026.github.io/uniform/'
        
      },
      {
        id: '4',
        title: '數學科教材製作器',
        category: '教學輔助',
        icon: 'fa-book-open',
        color: 'from-purple-500 to-violet-600',
        url: 'https://shamsham2026.github.io/lesson-plan-generator'
      },
      {
        id: '5',
        title: '代課/調課電子通知表格',
        category: '行政管理',
        icon: 'fa-file-signature',
        color: 'from-rose-500 to-pink-600',
        url: 'https://whatsform.com/mj_i3u'
      },
      {
        id: '6',
        title: '特別時間表',
        category: '教學輔助',
        icon: 'fa-calendar-alt',
        color: 'from-sky-500 to-blue-600',
        url: ''
      },
      {
        id: '7',
        title: '數學小遊戲提示詞生成器',
        category: '教學輔助',
        icon: 'fa-file-signature',
        color: 'from-rose-500 to-pink-600',
        url: 'https://shamsham2026.github.io/game-generator/'
      },
      {
        id: '8',
        title: '滬江小學數學科全科診斷系統',
        category: '教學輔助',
        icon: 'fa-file-signature',
        color: 'from-rose-500 to-pink-600',
        url: 'https://script.google.com/macros/s/AKfycbwel_uY6so203jh6U4DIb8JjXu0PNQohIZHaDnCtlr_bSMdboqwABNibtMySDzrW_ol/exec'
      },
      {
        id: '9',
        title: '滬江小學數學科遊戲平台',
        category: '教學輔助',
        icon: 'fa-file-signature',
        color: 'from-rose-500 to-pink-600',
        url: 'https://sap-maths.github.io/all-in-one-game/'
      },
      {
        id: '10',
        title: '乘法對戰遊戲',
        category: '教學輔助',
        icon: 'fa-file-signature',
        color: 'from-rose-500 to-pink-600',
        url: 'https://shamsham2026.github.io/p3-multiplication/'
      }
    ];

    const AVAILABLE_ICONS = [
      'fa-calculator', 'fa-user-check', 'fa-list-check', 'fa-book-open',
      'fa-file-signature', 'fa-calendar-alt', 'fa-magnifying-glass', 'fa-cubes',
      'fa-clipboard-list', 'fa-chart-pie', 'fa-gear', 'fa-folder'
    ];

    const AVAILABLE_COLORS = [
      'from-blue-500 to-indigo-600',
      'from-emerald-500 to-teal-600',
      'from-amber-500 to-orange-600',
      'from-purple-500 to-violet-600',
      'from-rose-500 to-pink-600',
      'from-sky-500 to-blue-600',
      'from-slate-600 to-slate-800'
    ];

    let apps = [];
    let currentCategory = 'ALL';
    const STORAGE_KEY = 'portal_apps_v5';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatUrl(rawUrl) {
      if (!rawUrl || !rawUrl.trim()) return '';
      const trimmed = rawUrl.trim();
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return BASE_URL + trimmed.replace(/^\/+/, '');
    }

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          apps = (Array.isArray(parsed) && parsed.length > 0) ? parsed : [...DEFAULT_APPS];
        } catch (e) {
          apps = [...DEFAULT_APPS];
        }
      } else {
        apps = [...DEFAULT_APPS];
      }
      saveToStorage();
      renderCategoryFilters();
      renderApps();
      setupPickers();
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
    }

    function renderCategoryFilters() {
      const categories = ['ALL', ...new Set(apps.map(a => a.category).filter(Boolean))];
      const container = document.getElementById('categoryFilter');
      if (!container) return;
      
      container.innerHTML = categories.map(cat => {
        const active = currentCategory === cat;
        const label = cat === 'ALL' ? '全部程式' : escapeHtml(cat);
        const escapedCat = escapeHtml(cat);
        return `
          <button type="button" onclick="setCategory('${escapedCat}')" class="px-3 py-1.5 text-xs font-medium rounded-lg transition whitespace-nowrap ${
            active 
              ? 'bg-slate-900 text-white shadow-sm' 
              : 'bg-white text-slate-600 hover:bg-slate-200/60 border border-slate-200'
          }">
            ${label}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryFilters();
      renderApps();
    }

    function renderApps() {
      const searchEl = document.getElementById('searchInput');
      const searchTerm = searchEl ? searchEl.value.toLowerCase().trim() : '';
      const grid = document.getElementById('appsGrid');
      const emptyState = document.getElementById('emptyState');
      if (!grid || !emptyState) return;

      const filtered = apps.filter(app => {
        const matchesCategory = currentCategory === 'ALL' || app.category === currentCategory;
        const matchesSearch = (app.title && app.title.toLowerCase().includes(searchTerm)) || 
                              (app.category && app.category.toLowerCase().includes(searchTerm));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      emptyState.classList.add('hidden');

      grid.innerHTML = filtered.map(app => {
        const targetUrl = formatUrl(app.url);
        const hasUrl = targetUrl.length > 0;
        const safeId = escapeHtml(app.id);
        const safeTitle = escapeHtml(app.title);
        const safeCategory = escapeHtml(app.category || '未分類');
        const safeIcon = escapeHtml(app.icon || 'fa-cubes');
        const safeColor = escapeHtml(app.color || 'from-blue-500 to-indigo-600');
        const safeUrl = escapeHtml(targetUrl);
        
        return `
          <div class="group relative bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between">
            
            <button type="button" onclick="openEditModal('${safeId}')" title="編輯小程式" class="absolute top-3 right-3 w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-10">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>

            <div class="flex flex-col items-center text-center pt-2 pb-4">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${safeColor} text-white flex items-center justify-center text-2xl shadow-md mb-3 group-hover:scale-105 transition-transform">
                <i class="fa-solid ${safeIcon}"></i>
              </div>
              <h3 class="font-bold text-slate-800 text-sm mb-1 line-clamp-1">${safeTitle}</h3>
              <span class="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">
                ${safeCategory}
              </span>
            </div>

            ${hasUrl ? `
              <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-2 px-3 text-xs font-semibold text-center text-white bg-slate-900 hover:bg-blue-600 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
                <span>進入程式</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            ` : `
              <button type="button" onclick="openEditModal('${safeId}')" class="w-full py-2 px-3 text-xs font-semibold text-center text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200/60 rounded-xl transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-link text-[10px]"></i>
                <span>設定網址</span>
              </button>
            `}
          </div>
        `;
      }).join('');
    }

    function setupPickers() {
      const iconContainer = document.getElementById('iconPicker');
      if (iconContainer) {
        iconContainer.innerHTML = AVAILABLE_ICONS.map(icon => `
          <button type="button" onclick="selectIcon('${icon}')" class="icon-option p-2 border border-slate-200 rounded-lg flex items-center justify-center hover:bg-slate-50 text-slate-600" data-icon="${icon}">
            <i class="fa-solid ${icon}"></i>
          </button>
        `).join('');
      }

      const colorContainer = document.getElementById('colorPicker');
      if (colorContainer) {
        colorContainer.innerHTML = AVAILABLE_COLORS.map(color => `
          <button type="button" onclick="selectColor('${color}')" class="color-option w-8 h-8 rounded-full bg-gradient-to-tr ${color} border-2 border-transparent" data-color="${color}">
          </button>
        `).join('');
      }
    }

    function selectIcon(icon) {
      document.getElementById('appIcon').value = icon;
      document.querySelectorAll('.icon-option').forEach(btn => {
        if (btn.dataset.icon === icon) {
          btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
        } else {
          btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600');
        }
      });
    }

    function selectColor(color) {
      document.getElementById('appColor').value = color;
      document.querySelectorAll('.color-option').forEach(btn => {
        if (btn.dataset.color === color) {
          btn.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500');
        }
      });
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = '新增小程式';
      document.getElementById('appId').value = '';
      document.getElementById('appForm').reset();
      document.getElementById('deleteBtn').classList.add('hidden');
      selectIcon('fa-cubes');
      selectColor('from-blue-500 to-indigo-600');
      document.getElementById('appModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const app = apps.find(a => String(a.id) === String(id));
      if (!app) return;

      document.getElementById('modalTitle').innerText = '編輯小程式';
      document.getElementById('appId').value = app.id;
      document.getElementById('appName').value = app.title;
      document.getElementById('appUrl').value = app.url || '';
      document.getElementById('appCategory').value = app.category || '';
      document.getElementById('deleteBtn').classList.remove('hidden');

      selectIcon(app.icon || 'fa-cubes');
      selectColor(app.color || 'from-blue-500 to-indigo-600');

      document.getElementById('appModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('appModal').classList.add('hidden');
    }

    function saveApp(e) {
      e.preventDefault();
      const id = document.getElementById('appId').value;
      const title = document.getElementById('appName').value.trim();
      let rawUrl = document.getElementById('appUrl').value.trim();
      const category = document.getElementById('appCategory').value.trim() || '未分類';
      const icon = document.getElementById('appIcon').value;
      const color = document.getElementById('appColor').value;

      const url = formatUrl(rawUrl);

      if (id) {
        const index = apps.findIndex(a => String(a.id) === String(id));
        if (index !== -1) {
          apps[index] = { ...apps[index], title, url, category, icon, color };
        }
      } else {
        const newApp = {
          id: Date.now().toString(),
          title,
          url,
          category,
          icon,
          color
        };
        apps.push(newApp);
      }

      saveToStorage();
      renderCategoryFilters();
      renderApps();
      closeModal();
      showToast('小程式已成功儲存！');
    }

    function deleteApp() {
      const id = document.getElementById('appId').value;
      if (!id) return;

      if (confirm('確定要刪除這個小程式嗎？')) {
        apps = apps.filter(a => String(a.id) !== String(id));
        saveToStorage();
        renderCategoryFilters();
        renderApps();
        closeModal();
        showToast('小程式已刪除', true);
      }
    }

    function resetSearch() {
      document.getElementById('searchInput').value = '';
      setCategory('ALL');
    }

    function openBackupModal() {
      document.getElementById('backupData').value = JSON.stringify(apps, null, 2);
      document.getElementById('backupModal').classList.remove('hidden');
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.add('hidden');
    }

    function copyBackupJSON() {
      const textarea = document.getElementById('backupData');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textarea.value).then(() => {
          showToast('已複製設定 JSON 到剪貼簿');
        }).catch(() => {
          fallbackCopy(textarea);
        });
      } else {
        fallbackCopy(textarea);
      }
    }

    function fallbackCopy(textarea) {
      textarea.select();
      document.execCommand('copy');
      showToast('已複製設定 JSON 到剪貼簿');
    }

    function importBackupJSON() {
      try {
        const data = JSON.parse(document.getElementById('backupData').value);
        if (Array.isArray(data)) {
          apps = data;
          saveToStorage();
          renderCategoryFilters();
          renderApps();
          closeBackupModal();
          showToast('已成功載入新設定！');
        } else {
          alert('格式錯誤，請確認輸入的是有效的 JSON 陣列');
        }
      } catch (e) {
        alert('JSON 解析失敗，請檢查輸入的內容是否正確');
      }
    }

    function resetToDefault() {
      if (confirm('確定要重設為預設狀態嗎？手動新增的連結將會清除。')) {
        apps = [...DEFAULT_APPS];
        saveToStorage();
        renderCategoryFilters();
        renderApps();
        closeBackupModal();
        showToast('已復原為預設設定');
      }
    }

    function showToast(msg, isWarning = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toastIcon.className = isWarning ? 'fa-solid fa-triangle-exclamation text-amber-400' : 'fa-solid fa-circle-check text-emerald-400';

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // 確保 DOM 載入後立即執行初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
